<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprobador de Lotería - Móvil</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse para procesamiento de datos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen">
  <div class="max-w-lg mx-auto bg-white p-5 rounded-2xl shadow-lg border border-slate-200">
    
    <!-- Encabezado -->
    <div class="text-center mb-6">
      <h1 class="text-xl font-bold text-slate-900">Comprobador de Existencias</h1>
      <p class="text-xs text-slate-500 mt-1">Detecta números con menos de 400 fracciones en el listado oficial.</p>
    </div>

    <div class="space-y-5 mb-6">
      
      <!-- 1. Listado Oficial (Archivo o URL) -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
        <label class="block font-bold text-xs text-slate-800 mb-2">1. Listado Oficial (Loterías)</label>
        
        <!-- Opción A: Subir Archivo Oficial -->
        <div class="mb-3">
          <label for="officialFile" class="block text-[11px] font-semibold text-slate-600 mb-1">📁 Subir archivo oficial de tu móvil:</label>
          <input type="file" id="officialFile" 
                 class="block w-full text-xs text-slate-500 
                        file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 
                        file:text-xs file:font-semibold file:bg-blue-100 file:text-blue-700 
                        hover:file:bg-blue-200 cursor-pointer">
        </div>

        <div class="text-center text-[10px] text-slate-400 font-bold my-1">— O descarga directa por URL —</div>

        <!-- Opción B: URL -->
        <div>
          <label for="officialUrl" class="block text-[11px] font-semibold text-slate-600 mb-1">🔗 URL Oficial:</label>
          <input type="text" id="officialUrl" 
                 value="https://www.loteriasyapuestas.es/new-geo-web/GeoTerminalServlet/Sorteo2026102.csv?drawId=1332409102&locale=es&cdc=13324" 
                 class="w-full text-[11px] p-2 border rounded-md bg-white outline-none focus:ring-1 focus:ring-blue-500">
        </div>
      </div>

      <!-- 2. Tu Listado Propio -->
      <div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-xl p-4">
        <label for="customFile" class="block font-bold text-xs text-blue-900 mb-2">
          📱 2. Tu Listado Propio (.txt / .csv)
        </label>
        <input type="file" id="customFile" 
               class="block w-full text-xs text-slate-600 
                      file:mr-3 file:py-2.5 file:px-4 file:rounded-lg file:border-0 
                      file:text-xs file:font-semibold file:bg-blue-600 file:text-white 
                      hover:file:bg-blue-700 active:file:bg-blue-800 cursor-pointer">
        <p class="text-[11px] text-slate-500 mt-2">Admite un número por línea o archivo con cabeceras.</p>
      </div>

      <!-- Ajuste del Umbral -->
      <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
        <label for="threshold" class="font-medium text-xs text-slate-700">Fracciones menores a:</label>
        <input type="number" id="threshold" value="400" class="w-20 p-2 border rounded-md text-center font-bold text-slate-800 bg-white">
      </div>
      
    </div>

    <!-- Botón Principal -->
    <button onclick="procesarListados()" id="btnProcess" 
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow transition text-sm">
      🔍 Comprobar Existencias
    </button>

    <!-- Indicador de Estado -->
    <div id="status" class="hidden my-4 p-3 rounded-xl text-xs font-medium text-center"></div>

    <!-- Tabla de Resultados -->
    <div id="resultsContainer" class="hidden mt-6">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-sm text-slate-800">Coincidencias (<span id="countResult">0</span>)</h2>
        <button onclick="exportarCSV()" class="text-xs bg-emerald-600 active:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-medium shadow">
          Descargar .CSV
        </button>
      </div>

      <div class="overflow-x-auto border border-slate-200 rounded-xl">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100 text-slate-600 border-b">
            <tr>
              <th class="p-2.5">Número</th>
              <th class="p-2.5">Fracciones</th>
              <th class="p-2.5">Estado</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 bg-white">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let resultadosGlobales = [];

    async function procesarListados() {
      const status = document.getElementById('status');
      const resultsContainer = document.getElementById('resultsContainer');
      
      const officialFileInput = document.getElementById('officialFile').files[0];
      const officialUrl = document.getElementById('officialUrl').value.trim();
      
      const customFileInput = document.getElementById('customFile').files[0];
      const threshold = parseInt(document.getElementById('threshold').value, 10);

      if (!customFileInput) {
        showStatus('⚠️ Selecciona tu listado propio (.txt / .csv) antes de continuar.', 'bg-amber-100 text-amber-900 border border-amber-200');
        return;
      }

      showStatus('⏳ Leyendo archivos y procesando...', 'bg-blue-100 text-blue-900 border border-blue-200');
      resultsContainer.classList.add('hidden');

      try {
        // 1. Obtener contenido del listado oficial (Archivo subido o URL)
        let textOficial = '';

        if (officialFileInput) {
          textOficial = await officialFileInput.text();
        } else if (officialUrl) {
          const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(officialUrl);
          const resOficial = await fetch(proxyUrl);
          if (!resOficial.ok) throw new Error('No se pudo descargar el listado oficial desde la URL.');
          textOficial = await resOficial.text();
        } else {
          throw new Error('Debes seleccionar el archivo oficial o introducir una URL.');
        }
        
        const oficialParsed = Papa.parse(textOficial, { header: true, skipEmptyLines: true, dynamicTyping: true });
        
        // Mapear NUMERO -> FRACCIONES
        const mapaOficial = {};
        oficialParsed.data.forEach(row => {
          const keyNumero = Object.keys(row).find(k => k && k.trim().toUpperCase().includes('NUMERO')) || 'NUMERO';
          const keyFracciones = Object.keys(row).find(k => k && k.trim().toUpperCase().includes('FRACCION')) || 'FRACCIONES';

          if (row[keyNumero] !== undefined && row[keyNumero] !== null) {
            const numStr = String(row[keyNumero]).trim().padStart(5, '0');
            const fracciones = parseInt(row[keyFracciones] || 0, 10);
            mapaOficial[numStr] = fracciones;
          }
        });

        // 2. Leer archivo .txt propio
        const textPropio = await customFileInput.text();
        const lineas = textPropio.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        let numerosPropios = [];

        const primerLinea = lineas[0] || '';
        if (primerLinea.toUpperCase().includes('NUMERO')) {
          const propioParsed = Papa.parse(textPropio, { header: true, skipEmptyLines: true });
          propioParsed.data.forEach(row => {
            const keyNum = Object.keys(row).find(k => k && k.trim().toUpperCase().includes('NUMERO')) || Object.keys(row)[0];
            if (row[keyNum]) {
              const numStr = String(row[keyNum]).replace(/\D/g, '').padStart(5, '0');
              if (numStr) numerosPropios.push(numStr);
            }
          });
        } else {
          lineas.forEach(linea => {
            const numLimpio = linea.replace(/\D/g, '');
            if (numLimpio.length > 0) {
              numerosPropios.push(numLimpio.padStart(5, '0'));
            }
          });
        }

        numerosPropios = [...new Set(numerosPropios)];

        // 3. Cruzar datos
        resultadosGlobales = [];
        numerosPropios.forEach(num => {
          const fraccionesOficiales = mapaOficial[num];

          if (fraccionesOficiales !== undefined && fraccionesOficiales < threshold) {
            resultadosGlobales.push({
              numero: num,
              fracciones: fraccionesOficiales
            });
          }
        });

        // 4. Mostrar Resultados
        renderResultados(threshold);
        showStatus(`✅ Proceso finalizado: ${resultadosGlobales.length} números tienen menos de ${threshold} fracciones.`, 'bg-emerald-100 text-emerald-900 border border-emerald-200');

      } catch (err) {
        showStatus(`❌ Error: ${err.message}`, 'bg-red-100 text-red-900 border border-red-200');
      }
    }

    function renderResultados(threshold) {
      const tbody = document.getElementById('tableBody');
      const countResult = document.getElementById('countResult');
      tbody.innerHTML = '';
      countResult.innerText = resultadosGlobales.length;

      resultadosGlobales.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-2.5 font-mono font-bold text-blue-700 text-sm">${item.numero}</td>
          <td class="p-2.5 font-semibold text-red-600">${item.fracciones}</td>
          <td class="p-2.5"><span class="px-2 py-0.5 text-[10px] font-semibold bg-red-100 text-red-700 rounded-full">&lt; ${threshold}</span></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('resultsContainer').classList.remove('hidden');
    }

    function showStatus(msg, classes) {
      const status = document.getElementById('status');
      status.className = `my-4 p-3 rounded-xl text-xs font-medium text-center ${classes}`;
      status.innerText = msg;
      status.classList.remove('hidden');
    }

    function exportarCSV() {
      if (!resultadosGlobales.length) return;
      const csv = Papa.unparse(resultadosGlobales);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", `resultados_fracciones.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
